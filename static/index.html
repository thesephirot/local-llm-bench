<!DOCTYPE html>
<html lang="en" class="h-full bg-gray-950 text-gray-100">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LLM Benchmark Dashboard</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
<script>tailwind.config={theme:{extend:{colors:{surface:{DEFAULT:'#0f172a','200':'#1e293b','300':'#334155','400':'#475569'}}}}}</script>
<style>
::-webkit-scrollbar{width:6px;height:6px}::-webkit-scrollbar-track{background:#0f172a}::-webkit-scrollbar-thumb{background:#334155;border-radius:3px}
.fade-in{animation:fadeIn .2s ease}@keyframes fadeIn{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:translateY(0)}}
.tab-active{border-bottom:2px solid #06b6d4;color:#06b6d4}.tab-inactive{border-bottom:2px solid transparent;color:#6b7280}.tab-inactive:hover{color:#d1d5db}
table.sortable th{cursor:pointer;user-select:none}table.sortable th:hover{color:#06b6d4}
canvas[id^="chart"]{width:100%!important;height:220px!important;max-height:220px!important;display:block}
.comparison-card{transition:all .15s ease}
.comparison-card:hover{transform:translateY(-1px);box-shadow:0 4px 20px rgba(6,182,212,0.1)}
.badge-best{background:rgba(34,197,94,0.15);color:#22c55e;border:1px solid rgba(34,197,94,0.3)}
.badge-worst{background:rgba(239,68,68,0.15);color:#ef4444;border:1px solid rgba(239,68,68,0.3)}
</style>
</head>
<body class="h-full overflow-hidden">
<div class="flex h-full">

<!-- Sidebar -->
<aside class="w-72 bg-surface border-r border-surface-300 flex flex-col shrink-0">
  <div class="p-4 border-b border-surface-300">
    <h1 class="text-lg font-bold bg-gradient-to-r from-cyan-400 to-blue-500 bg-clip-text text-transparent">LLM Benchmarks</h1>
    <p class="text-xs text-gray-500 mt-0.5">Compare endpoints &amp; models</p>
  </div>

  <div class="p-4 border-b border-surface-300">
    <div class="flex items-center justify-between mb-2">
      <h2 class="text-xs font-semibold uppercase tracking-wider text-gray-400">Endpoints</h2>
      <button onclick="showEndpointModal()" class="text-cyan-400 hover:text-cyan-300 text-sm font-medium">+ Add</button>
    </div>
    <div id="endpointList" class="space-y-1 max-h-40 overflow-y-auto"></div>
  </div>

  <div class="p-4 border-b border-surface-300">
    <div class="flex items-center justify-between mb-2">
      <h2 class="text-xs font-semibold uppercase tracking-wider text-gray-400">Chain Configs</h2>
      <button onclick="showChainConfigModal()" class="text-cyan-400 hover:text-cyan-300 text-sm font-medium">+ Add</button>
    </div>
    <div id="chainConfigList" class="space-y-1 max-h-36 overflow-y-auto"></div>
  </div>

  <div class="p-4 border-b border-surface-300">
    <div class="flex items-center justify-between mb-2">
      <h2 class="text-xs font-semibold uppercase tracking-wider text-gray-400">Presets</h2>
      <button onclick="showPresetModal()" class="text-cyan-400 hover:text-cyan-300 text-sm font-medium">+ Add</button>
    </div>
    <div id="presetList" class="space-y-1 max-h-40 overflow-y-auto"></div>
  </div>

</aside>

<!-- Main -->
<main class="flex-1 flex flex-col overflow-hidden">
  <!-- Config bar -->
  <div class="p-4 bg-surface border-b border-surface-300 shrink-0">
    <!-- Single-run row -->
    <div class="flex flex-wrap gap-3 items-end">
      <div><label class="block text-xs text-gray-400 mb-1">Endpoint</label><select id="selEndpoint" onchange="onEndpointChange()" class="bg-surface-200 border border-surface-400 rounded-lg px-3 py-2 text-sm min-w-[160px] focus:outline-none focus:ring-2 focus:ring-cyan-500"><option value="">— endpoint —</option></select></div>
      <div><label class="block text-xs text-gray-400 mb-1">Model</label><select id="selModel" class="bg-surface-200 border border-surface-400 rounded-lg px-3 py-2 text-sm min-w-[220px] focus:outline-none focus:ring-2 focus:ring-cyan-500"><option value="">— model —</option></select></div>
      <div><label class="block text-xs text-gray-400 mb-1">Preset</label><select id="selPreset" class="bg-surface-200 border border-surface-400 rounded-lg px-3 py-2 text-sm min-w-[140px] focus:outline-none focus:ring-2 focus:ring-cyan-500"><option value="">— preset —</option></select></div>
      <div><label class="block text-xs text-gray-400 mb-1">Tokens</label><input id="inpMaxTokens" type="number" value="2048" min="64" max="131072" class="bg-surface-200 border border-surface-400 rounded-lg px-3 py-2 text-sm w-24 focus:outline-none focus:ring-2 focus:ring-cyan-500"></div>
      <div><label class="block text-xs text-gray-400 mb-1">Temp</label><input id="inpTemp" type="number" value="0.7" min="0" max="2" step="0.1" class="bg-surface-200 border border-surface-400 rounded-lg px-3 py-2 text-sm w-16 focus:outline-none focus:ring-2 focus:ring-cyan-500"></div>
      <button id="btnRun" onclick="runBenchmark()" disabled class="bg-cyan-600 hover:bg-cyan-500 disabled:opacity-40 disabled:cursor-not-allowed text-white font-semibold rounded-lg px-5 py-2 text-sm transition-colors">Run</button>
    </div>
    <!-- Chain-run row -->
    <div class="flex flex-wrap gap-3 items-end mt-3 pt-3 border-t border-surface-300">
      <div class="flex-1 min-w-[200px]">
        <label class="block text-xs text-gray-400 mb-1">Chain LLMs</label>
        <div id="chainRunConfigList" class="bg-surface border border-surface-400 rounded-lg px-3 py-1.5 max-h-28 overflow-y-auto text-xs space-y-0.5">
          <p class="text-gray-600">No chain configs — create one first</p>
        </div>
      </div>
      <button id="btnRunChain" onclick="runChainBenchmarkStream()" disabled class="bg-purple-600 hover:bg-purple-500 disabled:opacity-40 disabled:cursor-not-allowed text-white font-semibold rounded-lg px-5 py-2 text-sm transition-colors">Run Chain</button>
    </div>
  </div>

  <!-- Chain status bar (live progress of any running chain) -->
  <div id="chainStatusBar" class="hidden px-4 py-1.5 bg-purple-900/30 border-b border-purple-800/50 text-xs text-purple-200 items-center gap-2 shrink-0"></div>

  <!-- Tabs -->
  <div class="flex border-b border-surface-300 shrink-0 bg-surface/50 gap-0">
    <button onclick="switchTab('dashboard')" id="tab-dashboard" class="tab-active px-5 py-2.5 text-sm font-medium transition-colors">Dashboard</button>
    <button onclick="switchTab('history')" id="tab-history" class="tab-inactive px-5 py-2.5 text-sm font-medium transition-colors">History</button>
    <button onclick="switchTab('compare')" id="tab-compare" class="tab-inactive px-5 py-2.5 text-sm font-medium transition-colors">Compare</button>
    <button onclick="switchTab('charts')" id="tab-charts" class="tab-inactive px-5 py-2.5 text-sm font-medium transition-colors">Trends</button>
  </div>

  <!-- Tab panels -->
  <div id="panel-dashboard" class="flex-1 overflow-y-auto p-4 tab-panel"></div>
  <div id="panel-history" class="flex-1 overflow-y-auto p-4 tab-panel hidden"></div>
  <div id="panel-compare" class="flex-1 overflow-y-auto p-4 tab-panel hidden"></div>
  <div id="panel-charts" class="flex-1 overflow-y-auto p-4 tab-panel hidden"></div>
</main>
</div>

<!-- Endpoint modal -->
<div id="endpointModal" class="hidden fixed inset-0 bg-black/60 z-50 flex items-center justify-center">
  <div class="bg-surface-200 border border-surface-400 rounded-xl w-full max-w-md p-6 fade-in">
    <h3 id="modalTitle" class="text-lg font-semibold mb-4">Add Endpoint</h3><input type="hidden" id="epId">
    <div class="space-y-3">
      <div><label class="block text-xs text-gray-400 mb-1">Name</label><input id="epName" class="w-full bg-surface border border-surface-400 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-cyan-500" placeholder="My LLM Server"></div>
      <div><label class="block text-xs text-gray-400 mb-1">Base URL</label><input id="epUrl" class="w-full bg-surface border border-surface-400 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-cyan-500" placeholder="http://localhost:8080"></div>
      <div><label class="block text-xs text-gray-400 mb-1">API Key</label><input id="epKey" type="password" class="w-full bg-surface border border-surface-400 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-cyan-500" placeholder="sk-..."></div>
      <div><label class="block text-xs text-gray-400 mb-1">Extra Headers (JSON)</label><input id="epHeaders" class="w-full bg-surface border border-surface-400 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-cyan-500" placeholder='{"X-Custom":"value"}'></div>
    </div>
    <div class="flex justify-end gap-2 mt-5">
      <button onclick="closeModal('endpointModal')" class="px-4 py-2 text-sm text-gray-400 hover:text-gray-200 rounded-lg">Cancel</button>
      <button onclick="saveEndpoint()" class="px-4 py-2 text-sm bg-cyan-600 hover:bg-cyan-500 text-white rounded-lg font-medium">Save</button>
    </div>
  </div>
</div>

<!-- Preset modal -->
<div id="presetModal" class="hidden fixed inset-0 bg-black/60 z-50 flex items-center justify-center">
  <div class="bg-surface-200 border border-surface-400 rounded-xl w-full max-w-lg p-6 fade-in">
    <h3 id="presetModalTitle" class="text-lg font-semibold mb-4">Add Preset</h3><input type="hidden" id="presetId"><input type="hidden" id="presetEditKey">
    <div class="space-y-3">
      <div class="grid grid-cols-2 gap-3">
        <div><label class="block text-xs text-gray-400 mb-1">Key (slug)</label><input id="presetKey" class="w-full bg-surface border border-surface-400 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-cyan-500" placeholder="my-preset"></div>
        <div><label class="block text-xs text-gray-400 mb-1">Name</label><input id="presetName" class="w-full bg-surface border border-surface-400 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-cyan-500" placeholder="My Preset"></div>
      </div>
      <div><label class="block text-xs text-gray-400 mb-1">Prompt</label><textarea id="presetPrompt" rows="4" class="w-full bg-surface border border-surface-400 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-cyan-500" placeholder="Enter prompt text..."></textarea></div>
      <div><label class="block text-xs text-gray-400 mb-1">Description</label><input id="presetDesc" class="w-full bg-surface border border-surface-400 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-cyan-500" placeholder="What this preset tests"></div>
    </div>
    <div class="flex justify-end gap-2 mt-5">
      <button onclick="closeModal('presetModal')" class="px-4 py-2 text-sm text-gray-400 hover:text-gray-200 rounded-lg">Cancel</button>
      <button onclick="savePreset()" class="px-4 py-2 text-sm bg-cyan-600 hover:bg-cyan-500 text-white rounded-lg font-medium">Save</button>
    </div>
  </div>
</div>

<!-- Chain config modal -->
<div id="chainConfigModal" class="hidden fixed inset-0 bg-black/60 z-50 flex items-center justify-center">
  <div class="bg-surface-200 border border-surface-400 rounded-xl w-full max-w-lg p-6 fade-in">
    <h3 id="chainConfigModalTitle" class="text-lg font-semibold mb-4">Save Chain Config</h3><input type="hidden" id="chainCfgId">
    <div class="space-y-3">
      <div><label class="block text-xs text-gray-400 mb-1">Config Name</label><input id="chainCfgName" class="w-full bg-surface border border-surface-400 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-cyan-500" placeholder="My Config"></div>
      <div class="grid grid-cols-2 gap-3">
        <div><label class="block text-xs text-gray-400 mb-1">Endpoint</label><select id="chainCfgEndpoint" onchange="loadChainCfgModels()" class="w-full bg-surface border border-surface-400 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-cyan-500"></select></div>
        <div><label class="block text-xs text-gray-400 mb-1">Models <span class="text-gray-600">(run in check order)</span></label><div id="chainCfgModelList" class="w-full bg-surface border border-surface-400 rounded-lg px-3 py-1.5 text-sm max-h-32 overflow-y-auto space-y-0.5 focus:outline-none focus:ring-2 focus:ring-cyan-500"><p class="text-gray-600 text-xs">— pick endpoint first —</p></div></div>
      </div>
      <div class="grid grid-cols-3 gap-3">
        <div><label class="block text-xs text-gray-400 mb-1">Preset</label><select id="chainCfgPreset" class="w-full bg-surface border border-surface-400 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-cyan-500"></select></div>
        <div><label class="block text-xs text-gray-400 mb-1">Max Tokens</label><input id="chainCfgMaxTokens" type="number" value="2048" class="w-full bg-surface border border-surface-400 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-cyan-500"></div>
        <div><label class="block text-xs text-gray-400 mb-1">Temp</label><input id="chainCfgTemp" type="number" value="0.7" step="0.1" class="w-full bg-surface border border-surface-400 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-cyan-500"></div>
      </div>
      <div><label class="block text-xs text-gray-400 mb-1">Notes</label><input id="chainCfgNotes" class="w-full bg-surface border border-surface-400 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-cyan-500" placeholder="Optional notes..."></div>
    </div>
    <div class="flex justify-end gap-2 mt-5">
      <button onclick="closeModal('chainConfigModal')" class="px-4 py-2 text-sm text-gray-400 hover:text-gray-200 rounded-lg">Cancel</button>
      <button onclick="saveChainConfig()" class="px-4 py-2 text-sm bg-cyan-600 hover:bg-cyan-500 text-white rounded-lg font-medium">Save</button>
    </div>
  </div>
</div>

<!-- Detail modal -->
<div id="detailModal" class="hidden fixed inset-0 bg-black/60 z-50 flex items-center justify-center p-4">
  <div class="bg-surface-200 border border-surface-400 rounded-xl w-full max-w-3xl max-h-[90vh] flex flex-col fade-in">
    <div class="p-4 border-b border-surface-300 flex items-center justify-between shrink-0">
      <div><h3 id="detailTitle" class="text-lg font-semibold"></h3><p id="detailMeta" class="text-xs text-gray-500 mt-0.5"></p></div>
      <button onclick="closeModal('detailModal')" class="text-gray-500 hover:text-gray-300 text-xl">&times;</button>
    </div>
    <div class="p-4 overflow-y-auto">
      <div id="detailStats" class="grid grid-cols-5 gap-3 mb-4"></div>
      <div class="bg-surface rounded-lg p-3 mb-3"><h4 class="text-xs font-semibold text-gray-400 uppercase mb-1">Prompt</h4><p id="detailPrompt" class="text-sm text-gray-300 whitespace-pre-wrap"></p></div>
      <div class="bg-surface rounded-lg p-3"><h4 class="text-xs font-semibold text-gray-400 uppercase mb-1">Response</h4><div id="detailResponse" class="text-sm text-gray-200 whitespace-pre-wrap leading-relaxed"></div></div>
    </div>
  </div>
</div>

<script src="/static/app.js?v=7"></script>
</body>
</html>
